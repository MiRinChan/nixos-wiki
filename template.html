<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="{{asset_prefix}}photo_2026-05-14_19-41-31.jpg"
    />
    <link rel="stylesheet" href="{{asset_prefix}}styles-base.css" />
    <link rel="stylesheet" href="{{asset_prefix}}styles-code-light.css" />
    <link rel="stylesheet" href="{{asset_prefix}}styles-code-dark.css" />
  </head>
  <body>
    <h1 class="autoInject">
      <a href="https://nixoscn.org">NixOS Wiki zh-CN</a> / {{heading}}
    </h1>
    <hr class="autoInject" />
    {{content}}
    <hr class="autoInject" />
    <footer class="autoInject">
      <a
        class="autoInject"
        href="{{github_edit_url}}"
        target="_blank"
        rel="noreferrer"
        >前往 GitHub 编辑此页</a
      >
    </footer>
    <script>
      // On click: push clean URL before navigating
      document.addEventListener("click", (e) => {
        const a = e.target.closest("a");
        if (!a) return;

        const url = new URL(a.href, location.origin);
        if (url.origin !== location.origin) return;

        const clean = url.pathname.replace(/\/$/, "") || "/";
        if (clean !== url.pathname) {
          e.preventDefault();
          history.pushState(null, "", clean + url.search + url.hash);
          window.location.href = clean + url.search + url.hash; // actually navigate
        }
      });

      // On load: replace in case user landed directly on a trailing-slash URL
      document.addEventListener("DOMContentLoaded", () => {
        let url = window.location.pathname;
        if (url === "/") return;
        if (url.endsWith("/")) {
          url = url.replace(/\/$/, "");
        }
        if (url !== window.location.pathname) {
          history.replaceState(null, "", url);
        }
      });
    </script>
  </body>
</html>
