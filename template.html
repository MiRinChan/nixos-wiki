<!doctype html>
<html lang="{{html_lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{canonical_url}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="{{canonical_url}}" />
    <meta property="og:site_name" content="{{site_name}}" />
    {{favicon_link}}
    <link rel="stylesheet" href="{{asset_prefix}}styles-base.css" />
    <link rel="stylesheet" href="{{asset_prefix}}styles-code-light.css" />
    <link rel="stylesheet" href="{{asset_prefix}}styles-code-dark.css" />
    <script src="{{asset_prefix}}anchor-highlight.js" defer></script>
    <script src="{{asset_prefix}}toc.js" defer></script>
    <script src="{{asset_prefix}}nav.js" defer></script>
    <!-- Pinned version + Subresource Integrity (supply-chain hardening).
         To update: bump the version, then recompute the hash with
         `curl -sL <url> | node -e 'const c=require("crypto");const h=c.createHash("sha384");process.stdin.on("data",d=>h.update(d)).on("end",()=>console.log("sha384-"+h.digest("base64")))'` -->
    <script
      src="https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js"
      integrity="sha384-yQ4mmBBT+vhTAwjFH0toJXNYJ6O4usWnt6EPIdWwrRvx2V/n5lXuDZQwQFeSFydF"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (typeof mermaid !== "undefined") {
          mermaid.initialize({ startOnLoad: true, theme: "default" });
        }
      });
    </script>
  </head>
  <body>
    <a class="skip-link" href="#wiki-content">跳到正文</a>
    <div id="wiki-progress" hidden></div>
    <h1 class="autoInject">{{site_link}} / {{heading}}</h1>
    <hr class="autoInject" />
    <nav id="toc" class="toc"></nav>
    <main id="wiki-content"><article>{{content}}</article></main>
    {{footer_html}}
  </body>
</html>
