name: Publish Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WIKI_SITE_TITLE: ${{ vars.WIKI_SITE_TITLE }}
      WIKI_SITE_ORIGIN: ${{ vars.WIKI_SITE_ORIGIN }}
      WIKI_HTML_LANG: ${{ vars.WIKI_HTML_LANG }}
      WIKI_ENTRY_URL_PREFIX: ${{ vars.WIKI_ENTRY_URL_PREFIX }}
      WIKI_EDIT_URL_TEMPLATE: ${{ vars.WIKI_EDIT_URL_TEMPLATE }}
      WIKI_EDIT_LINK_LABEL: ${{ vars.WIKI_EDIT_LINK_LABEL }}
      WIKI_FAVICON_PATH: ${{ vars.WIKI_FAVICON_PATH }}
      WIKI_CNAME: ${{ vars.WIKI_CNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ vars.WIKI_PUBLISH_BRANCH || 'pages' }}
          publish_dir: ./out
          force_orphan: true
